<!doctype html>
<html lang="fa" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="پی‌دی‌اف‌استور — فروشگاه آنلاین کتاب‌های دیجیتال PDF" />
    <title>پی‌دی‌اف‌استور | فروشگاه کتاب‌های دیجیتال</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <script>
      // Theme is resolved before first paint — light is the default.
      try {
        var stored = localStorage.getItem("pdfstore-theme");
        if (stored === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
